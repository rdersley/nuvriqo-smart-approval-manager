name: Deployed UI Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_TEST_ISSUE_KEY: ${{ secrets.JIRA_TEST_ISSUE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Restore Jira session
        run: mkdir -p .auth && echo '${{ secrets.JIRA_STORAGE_STATE_B64 }}' | base64 --decode > .auth/jira.json
      - name: Run deployed UI tests
        run: npx playwright test ui-tests
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
