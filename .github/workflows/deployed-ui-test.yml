name: Auto Deploy & UI Test

on:
  push:
    branches: [automation/playwright-ui-tests]
  workflow_dispatch:

concurrency:
  group: smart-approval-auto-deploy-ui
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_TEST_ISSUE_KEY: ${{ secrets.JIRA_TEST_ISSUE_KEY }}
      FORGE_SITE: nuvriqo.atlassian.net
      FORGE_ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check required secrets
        shell: bash
        env:
          JIRA_STORAGE_STATE_GZIP_B64: ${{ secrets.JIRA_STORAGE_STATE_GZIP_B64 }}
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN" && exit 1)
          test -n "$JIRA_BASE_URL" || (echo "Missing JIRA_BASE_URL" && exit 1)
          test -n "$JIRA_TEST_ISSUE_KEY" || (echo "Missing JIRA_TEST_ISSUE_KEY" && exit 1)
          test -n "$JIRA_STORAGE_STATE_GZIP_B64" || (echo "Missing JIRA_STORAGE_STATE_GZIP_B64" && exit 1)

      - name: Install and audit dependencies
        shell: bash
        run: |
          npm install
          npm audit --audit-level=high
          npm install --no-save @playwright/test

      - name: Run code checks
        run: npm test

      - name: Install Forge CLI and lint
        shell: bash
        run: |
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment "$FORGE_ENVIRONMENT"
          forge lint

      - name: Deploy to Nuvriqo development
        run: forge deploy --environment "$FORGE_ENVIRONMENT" --non-interactive

      - name: Install or upgrade development app with retry
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Forge installation attempt $attempt of 4"
            if forge install --upgrade --site "$FORGE_SITE" --product jira --environment "$FORGE_ENVIRONMENT" --confirm-scopes --non-interactive; then
              exit 0
            fi
            if forge install --site "$FORGE_SITE" --product jira --environment "$FORGE_ENVIRONMENT" --confirm-scopes --non-interactive; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Atlassian installation is not ready; waiting 30 seconds before retry"
              sleep 30
            fi
          done
          echo "Development installation failed after retries"
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore Jira session
        shell: bash
        env:
          JIRA_STORAGE_STATE_GZIP_B64: ${{ secrets.JIRA_STORAGE_STATE_GZIP_B64 }}
        run: |
          mkdir -p .auth
          printf '%s' "$JIRA_STORAGE_STATE_GZIP_B64" | base64 --decode | gzip --decompress > .auth/jira.json
          test -s .auth/jira.json
          node -e "JSON.parse(require('fs').readFileSync('.auth/jira.json','utf8')); console.log('Jira browser state restored')"

      - name: Allow Forge UI to settle
        run: sleep 10

      - name: Run Smart Approval deployed UI tests
        run: npx playwright test ui-tests

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
