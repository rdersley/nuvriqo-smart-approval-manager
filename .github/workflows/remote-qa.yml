name: Remote Forge QA

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy and upgrade the development installation
        required: true
        type: boolean
        default: false
      site:
        description: Atlassian site
        required: true
        default: nuvriqo.atlassian.net
      environment:
        description: Forge environment
        required: true
        default: development
      product:
        description: Atlassian product
        required: true
        default: jira

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if npm ci; then
            echo "Installed from lockfile"
          else
            echo "Lockfile install failed (commonly stale Forge prerelease URL); regenerating dependencies from package.json"
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund
          fi
      - name: Run tests
        run: npm test
      - name: Forge lint
        shell: bash
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN" && exit 1)
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment development
          forge lint

  deploy-development:
    needs: validate
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/jsm-forms-integration'))
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      DEPLOY_SITE: ${{ github.ref == 'refs/heads/feature/jsm-forms-integration' && 'retailinmotion.atlassian.net' || inputs.site || 'nuvriqo.atlassian.net' }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'development' }}
      DEPLOY_PRODUCT: ${{ inputs.product || 'jira' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if ! npm ci; then
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund
          fi
      - name: Check Forge credentials
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN" && exit 1)
      - run: npm install --global @forge/cli
      - name: Deploy
        run: |
          forge settings set usage-analytics false
          forge settings set default-environment "$DEPLOY_ENVIRONMENT"
          forge deploy --environment "$DEPLOY_ENVIRONMENT" --non-interactive
      - name: Upgrade installation
        run: forge install --upgrade --site "$DEPLOY_SITE" --product "$DEPLOY_PRODUCT" --environment "$DEPLOY_ENVIRONMENT" --confirm-scopes --non-interactive
      - name: Verify TEST project
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then echo "Jira credentials not configured; skipping REST smoke check"; exit 0; fi
          code=$(curl -sS -o /tmp/project.json -w "%{http_code}" -u "$JIRA_EMAIL:$JIRA_API_TOKEN" "https://$DEPLOY_SITE/rest/api/3/project/TEST")
          test "$code" = "200" || (cat /tmp/project.json && exit 1)
          echo "TEST project reachable"
