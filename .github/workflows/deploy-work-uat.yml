name: Deploy Work UAT Copy

on:
  workflow_dispatch:
    inputs:
      uat_app_id:
        description: Forge App ID for the unlicensed Work UAT copy
        required: true
        type: string
      confirm:
        description: Confirm deployment of the separate UAT copy
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-uat:
    if: inputs.confirm == true
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      UAT_APP_ID: ${{ inputs.uat_app_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if ! npm ci; then
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund
          fi
      - name: Prepare unlicensed UAT manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('manifest.yml')
          text = p.read_text()
          app_id = os.environ['UAT_APP_ID'].strip()
          if not re.fullmatch(r'[0-9a-fA-F-]{36}', app_id):
              raise SystemExit('Invalid Forge App ID format')
          text = re.sub(r'ari:cloud:ecosystem::app/[0-9a-fA-F-]{36}', f'ari:cloud:ecosystem::app/{app_id}', text, count=1)
          text = re.sub(r'\n  licensing:\n    enabled: true\n', '\n', text, count=1)
          p.write_text(text)
          PY
          echo 'Prepared separate unlicensed UAT manifest.'
      - name: Check Forge credentials
        shell: bash
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN" && exit 1)
      - name: Install Forge CLI
        run: npm install --global @forge/cli
      - name: Validate UAT copy
        shell: bash
        run: |
          npm test
          forge settings set usage-analytics false
          forge settings set default-environment production
          forge lint
      - name: Deploy UAT copy to production environment
        run: forge deploy --environment production --non-interactive
      - name: Show next step
        run: |
          echo 'UAT Forge copy deployed. In Developer Console, enable Sharing for this UAT app and generate its installation link.'
          echo 'Do not submit this UAT copy to Marketplace and do not enable licensing.'
